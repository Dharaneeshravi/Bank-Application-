
spring:
  application:
    name: configserver

  profiles:
    active: git



  management:
    endpoints:
      web:
        exposure:
          include: "*"
    health:
      readiness-state:
        enabled: true
      liveness-state:
        enabled: true
    endpoint:
      health:
        probes:
          enabled: true

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Dharaneeshravi/config.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
        monitor:
          validation-filter-enabled: false
server:
  port: 8071

encrypt:
  key: "ABCD1234ABCD!@#%^*&%*^&)*!#$^&*()"