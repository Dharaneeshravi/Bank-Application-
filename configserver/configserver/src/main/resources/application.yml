
spring:
  application:
    name: configserver

  profiles:
    active: git
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


  management:
    endpoints:
      web:
        exposure:
          include: "*"

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Dharaneeshravi/config.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
server:
  port: 8071

