server:
  port: 8090
spring:
  application:
    name: loans
  config:
    import: "configserver:http://localhost:8071/"

  datasource:
    url: jdbc:mysql://localhost:3307/loansdb
    username: root
    password: root
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  profiles:
    active: prod


management:
  endpoints:
    web:
      exposure:
        include: "*"


