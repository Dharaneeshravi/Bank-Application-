services:
  network-deploy-server:
    networks:
      - app-network

  microservice-db-config:
    extends:
      service: network-deploy-server
    image: mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
      environment:
        MYSQL_ROOT_PASSWORD: root

  microserveice-base-config:
    extends:
      service: network-deploy-server
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m


  microservice-configserver-config:
    extends:
      service: microserveice-base-config
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILE_ACTIVE: default
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
