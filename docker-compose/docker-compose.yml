 name: "microservice"
services:

  rabbit:
    image: rabbit:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    extends:
      service: network-deploy-server


  accounts:
    image: "dharaneesh0203/accounts:0.1"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
       configserver:
         condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config




  configserver:
    image: "dharaneesh0203/configserver:0.1"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
       rabbit:
         condition: service_healthy
    extends:
      file: common-config.yml
      service: microserveice-base-config





  loans:
    image: "dharaneesh0203/loans:0.1"
    container_name: loans-ms
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config




  cards:
    image: "dharaneesh0203/cards:0.1"
    container_name: cards-ms
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  app-network:
    driver: bridge
