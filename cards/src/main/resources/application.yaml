server:
  port: 9000
spring:
  application:
    name: cards
  config:
    import: "configserver:http://localhost:8071/"

  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: root
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  profiles:
    active: prod


management:
  endpoints:
    web:
      exposure:
        include: "*"
