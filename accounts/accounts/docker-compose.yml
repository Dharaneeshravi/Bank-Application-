 name: "microservice"
services:

  rabbit:
    image: rabbit:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app-network


  accounts:
    image: "dharaneesh0203/accounts:0.1"
    container_name: accounts-ms
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    depends_on:
       configserver:
         condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILE_ACTIVE: default
    networks:
      - app-network

  configserver:
    image: "dharaneesh0203/configserver:0.1"
    container_name: configserver-ms
    restart: unless-stopped
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 700m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
       rabbit:
         condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbit
    networks:
      - app-network

  loans:
    image: "dharaneesh0203/loans:0.1"
    container_name: loans-ms
    restart: unless-stopped
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILE_ACTIVE: default
    networks:
      - app-network

  cards:
    image: "dharaneesh0203/cards:0.1"
    container_name: cards-ms
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbit
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILE_ACTIVE: default
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
