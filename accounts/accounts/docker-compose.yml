 name: "microservice"
services:

  accounts:
    image: "dharaneesh0203/accounts:0.1"
    container_name: accounts-ms
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - app-network

  loans:
    image: "dharaneesh0203/loans:0.1"
    container_name: loans-ms
    restart: unless-stopped
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - app-network

  cards:
    image: "dharaneesh0203/cards:0.1"
    container_name: cards-ms
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
